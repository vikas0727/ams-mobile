# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── AMS backend wiring ────────────────────────────────────────────────────────
# These are fallbacks only. Put the real values in local.properties (git-ignored), which overrides
# everything here. digi.aesSecretKey must be the backend's AES_SECRET_KEY verbatim — the app runs
# it through SHA-256 exactly as Utils/cryptoUtil.js does — and digi.aesIv the same 32-char hex.
# A build left on the placeholder key will fail to decrypt every response, loudly, on first call.
digi.apiBaseUrl=http://10.0.2.2:5000/api/v1/
digi.aesSecretKey=CHANGE_ME
digi.aesIv=00000000000000000000000000000000
digi.aesEnabled=true
